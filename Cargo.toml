[package]
name = "crystal-cif-io"
version = "0.1.2"
edition = "2021"
author = "TonyWu20"
description = "A library to parse and write crystallography `cif` format."
keywords = ["chemistry", "crystallography"]
license = "MIT"
repository = "https://github.com/TonyWu20/crystal-cif-io"

[dependencies]
castep-periodic-table = "0.5"
chrono = "0.4"
indexmap = {version="2.2", optional=true}
serde_json = "1"
chumsky = "0.13"
ariadne = { version = "0.6", features = ["auto-color"] }


# The `castep-cell-io` git dev-branch dev-dependency no longer compiles
# (API drift in its own `UnitCellParameters` bound). Its only user was the
# dead file `src/data_dict/test.rs`, which is not in the module tree and has
# been removed.
